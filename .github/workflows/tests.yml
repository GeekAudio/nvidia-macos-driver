name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # Full history: negative controls read earlier revisions of the source.
          fetch-depth: 0
      - name: Show the tools in use
        run: python3 --version && clang --version
      - name: Fetch the Vulkan headers the plugin tests compile against
        # The plugin tests compile against $VULKAN_HEADERS, or ~/Vulkan-Headers/include when it is unset, as on a
        # development machine. Without them a dozen tests stop at "vulkan/vulkan.h not found" instead of checking
        # anything.
        run: git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers "$HOME/Vulkan-Headers"
      - name: Host tests
        run: python3 tools/run_all_tests.py -j 3
