name: Four-source integration

on:
  workflow_dispatch:
    inputs:
      update_sources:
        description: Merge the latest tracked source branches before building
        type: boolean
        required: true
        default: false
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: four-source-integration
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'GeekAudio/nvidia-macos-driver'
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/four-sources
          fetch-depth: 0
          submodules: true
      - name: Configure integration commits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Merge source updates
        id: sync
        if: github.event_name == 'schedule' || inputs.update_sources
        run: python3 integration/sync.py
      - name: Decide whether to build
        id: plan
        env:
          RUN_EVENT: ${{ github.event_name }}
          SOURCE_CHANGED: ${{ steps.sync.outputs.changed }}
        run: |
          if [ "$RUN_EVENT" != schedule ] || [ "$SOURCE_CHANGED" = true ]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.plan.outputs.build == 'true'
        with:
          python-version: '3.13'
      - name: Install build tools
        if: steps.plan.outputs.build == 'true'
        run: |
          test "$(uname -m)" = x86_64
          brew install make spirv-tools
          rustup toolchain install 1.99.1 --profile minimal
          echo 'RUSTUP_TOOLCHAIN=1.99.1' >> "$GITHUB_ENV"
          xcodebuild -version
      - name: Fetch locked dependencies
        if: steps.plan.outputs.build == 'true'
        run: python3 integration/prepare.py
      - name: Check BAR preflight
        if: steps.plan.outputs.build == 'true'
        run: python3 ci/test-bar-preflight.py
      - name: Build plugin, translator and codecs
        if: steps.plan.outputs.build == 'true'
        run: python3 integration/build-userspace.py
      - name: Check translator against the pinned upstream
        if: steps.plan.outputs.build == 'true'
        run: python3 integration/check-translator.py
      - name: Build all matching kernel components
        if: steps.plan.outputs.build == 'true'
        run: python3 ci/build-macos-kexts.py --vendor .deps/nvidia615 --output build-out --jobs 4
      - name: Package and verify
        if: steps.plan.outputs.build == 'true'
        run: python3 integration/package.py
      - name: Advance the integration branch after successful checks
        if: steps.sync.outputs.changed == 'true'
        run: git push origin HEAD:refs/heads/integration/four-sources
      - name: Preserve package and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: four-source-${{ github.run_number }}
          path: |
            build-out/nullmoth-nvidia-*-four-sources-*.tar.gz
            build-out/*.json
            build-out/SHA256SUMS.txt
            build-out/logs/
          if-no-files-found: ignore
          retention-days: 14
